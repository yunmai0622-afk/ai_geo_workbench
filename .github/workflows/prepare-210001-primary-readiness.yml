name: Prepare 210001 Primary Readiness
on:
  workflow_dispatch:
    inputs:
      confirm_project_id:
        description: "Type 210001"
        required: true
        type: string
concurrency:
  group: understand-primary-readiness-210001
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_OBSERVATION_LEDGER_V2: "false"
      CONFIRM_210001_PRIMARY_READINESS: "true"
    steps:
      - uses: actions/checkout@v4
      - run: test "${{ inputs.confirm_project_id }}" = "210001"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm verify:primary-readiness-schema
      - run: pnpm db:migrate
      - run: pnpm understanding:primary-readiness:210001 | tee primary-readiness-report.jsonl
      - uses: actions/upload-artifact@v4
        with: { name: primary-readiness-210001, path: primary-readiness-report.jsonl, retention-days: 30 }
