name: Deploy Railway Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip pnpm check/build/test before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_migrations:
        description: "Skip production database migrations for application-only deploys"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_smoke:
        description: "Skip production page smoke checks"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Test, Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'ep-20251210143333-s6bb7' }}
      ARK_DEEPSEEK_MODEL_ID: ${{ vars.ARK_DEEPSEEK_MODEL_ID }}
      OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '60000' }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID || vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_PRODUCTION_URL: ${{ secrets.RAILWAY_PRODUCTION_URL || vars.RAILWAY_PRODUCTION_URL }}
      RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
      GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application configuration
        run: |
          set -euo pipefail
          missing=0
          require() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing required configuration::$name is required"
              missing=1
            fi
          }

          require DATABASE_URL
          require JWT_SECRET
          require OPENAI_API_KEY
          require TAVILY_API_KEY
          require OPENAI_BASE_URL
          require OPENAI_MODEL
          require OPENAI_TIMEOUT_MS

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Type check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != 'true' }}
        run: corepack pnpm check

      - name: Build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != 'true' }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" corepack pnpm build

      - name: Prepare ignored CI test artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts client/public/downloads
          : > artifacts/AGENT_SERIES_DELIVERY.md
          : > artifacts/AGENT_SERIES_SCREENSHOTS.md
          if [ ! -e client/public/downloads/geo-local-agent-mac.dmg ] && [ ! -e client/public/downloads/geo-local-agent-mac.zip ]; then
            printf 'ci placeholder for ignored Local Agent binary; production uses manifest macZipUrl\n' > client/public/downloads/geo-local-agent-mac.zip
          fi

      - name: Test
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != 'true' }}
        run: corepack pnpm test

      - name: Validate Railway deployment target
        run: |
          set -euo pipefail
          missing=0
          require() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Railway configuration::$name is required"
              missing=1
            fi
          }

          require RAILWAY_PRODUCTION_URL

          if [ -z "${RAILWAY_DEPLOY_HOOK_URL:-}" ]; then
            require RAILWAY_TOKEN
            require RAILWAY_PROJECT_ID
            require RAILWAY_SERVICE_ID
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Apply production database migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_migrations != 'true' }}
        run: |
          set -euo pipefail
          echo "[migration] database version preflight (connection details are never printed)"
          corepack pnpm preflight:tidb-observation
          echo "[migration] applying committed Drizzle migrations before Railway deployment"
          node scripts/reconcile_brand_truth_migration.mjs
          corepack pnpm db:migrate
          OBSERVATION_TEST_DATABASE_URL="$DATABASE_URL" corepack pnpm db:verify-ai-observation
          echo "[migration] completed"

      - name: Deploy to Railway
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_DEPLOY_HOOK_URL:-}" ]; then
            curl --fail --show-error --silent --max-time 30 -X POST "$RAILWAY_DEPLOY_HOOK_URL" > /tmp/railway-deploy-response.txt
            echo "[railway] deploy hook accepted"
            exit 0
          fi

          node <<'NODE'
          const endpoint = "https://backboard.railway.com/graphql/v2";
          const token = process.env.RAILWAY_TOKEN;
          const projectId = process.env.RAILWAY_PROJECT_ID;
          const serviceId = process.env.RAILWAY_SERVICE_ID;
          const environmentName = process.env.RAILWAY_ENVIRONMENT || "production";
          const commitSha = process.env.GITHUB_SHA;
          const buildTime = new Date().toISOString();

          function required(name) {
            const value = process.env[name];
            if (typeof value !== "string" || !value.trim()) {
              throw new Error(`${name} is required`);
            }
            return value;
          }

          async function railway(query, variables, tokenMode = "bearer") {
            const headers = { "Content-Type": "application/json" };
            if (tokenMode === "project") {
              headers["Project-Access-Token"] = token;
            } else {
              headers.Authorization = `Bearer ${token}`;
            }

            const response = await fetch(endpoint, {
              method: "POST",
              headers,
              body: JSON.stringify({ query, variables }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.errors?.length) {
              const message =
                payload.errors?.map(error => error.message).join("; ") ||
                `HTTP ${response.status}`;
              throw new Error(message);
            }
            return payload.data;
          }

          async function resolveTarget(tokenMode) {
            const data = await railway(
              `query project($id: String!) {
                project(id: $id) {
                  id
                  name
                  services {
                    edges {
                      node {
                        id
                        name
                      }
                    }
                  }
                  environments {
                    edges {
                      node {
                        id
                        name
                      }
                    }
                  }
                }
              }`,
              { id: projectId },
              tokenMode,
            );

            const services = data.project?.services?.edges?.map(edge => edge.node) ?? [];
            const environments =
              data.project?.environments?.edges?.map(edge => edge.node) ?? [];
            const service = services.find(candidate => candidate.id === serviceId);
            const environment =
              environments.find(candidate => candidate.name === environmentName) ??
              environments[0];

            if (!service) {
              throw new Error(`service ${serviceId} was not found in Railway project ${projectId}`);
            }
            if (!environment?.id) {
              throw new Error(`environment ${environmentName} was not found in Railway project ${projectId}`);
            }

            return { project: data.project, service, environment };
          }

          async function main() {
            required("RAILWAY_TOKEN");
            required("RAILWAY_PROJECT_ID");
            required("RAILWAY_SERVICE_ID");
            required("DATABASE_URL");
            required("JWT_SECRET");
            required("OPENAI_API_KEY");
            required("TAVILY_API_KEY");

            const tokenModes = ["bearer", "project"];
            let tokenMode = null;
            let target = null;
            const errors = [];

            for (const candidate of tokenModes) {
              try {
                target = await resolveTarget(candidate);
                tokenMode = candidate;
                break;
              } catch (error) {
                errors.push(`${candidate}: ${error instanceof Error ? error.message : String(error)}`);
              }
            }

            if (!target || !tokenMode) {
              throw new Error(`Railway target lookup failed. ${errors.join(" | ")}`);
            }

            console.log(`[railway] token_mode=${tokenMode}`);
            console.log(`[railway] project=${target.project.name} service=${target.service.name} environment=${target.environment.name}`);

            const variables = {
              NODE_ENV: "production",
              DATABASE_URL: process.env.DATABASE_URL,
              JWT_SECRET: process.env.JWT_SECRET,
              LLM_PROVIDER: process.env.LLM_PROVIDER || "openai",
              OPENAI_API_KEY: process.env.OPENAI_API_KEY,
              OPENAI_BASE_URL: process.env.OPENAI_BASE_URL || "https://ark.cn-beijing.volces.com/api/v3",
              OPENAI_MODEL: process.env.OPENAI_MODEL || "ep-20251210143333-s6bb7",
              OPENAI_TIMEOUT_MS: process.env.OPENAI_TIMEOUT_MS || "60000",
              TAVILY_API_KEY: process.env.TAVILY_API_KEY,
              GIT_COMMIT: commitSha,
              BUILD_TIME: buildTime,
            };
            if (process.env.ARK_DEEPSEEK_MODEL_ID?.trim()) {
              variables.ARK_DEEPSEEK_MODEL_ID = process.env.ARK_DEEPSEEK_MODEL_ID.trim();
            }

            await railway(
              `mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) {
                variableCollectionUpsert(input: $input)
              }`,
              {
                input: {
                  projectId,
                  environmentId: target.environment.id,
                  serviceId,
                  variables,
                  replace: false,
                  skipDeploys: true,
                },
              },
              tokenMode,
            );
            console.log(`[railway] variables upserted: ${Object.keys(variables).join(", ")}`);

            const deployData = await railway(
              `mutation serviceInstanceDeployV2($serviceId: String!, $environmentId: String!, $commitSha: String!) {
                serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha)
              }`,
              {
                serviceId,
                environmentId: target.environment.id,
                commitSha,
              },
              tokenMode,
            );

            const deploymentId = deployData.serviceInstanceDeployV2;
            if (!deploymentId) {
              throw new Error("Railway did not return a deployment id");
            }
            console.log(`[railway] deployment_id=${deploymentId}`);

            const terminalStatuses = new Set(["SUCCESS", "FAILED", "CRASHED", "REMOVED", "SKIPPED"]);
            let lastStatus = "";
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              const deploymentData = await railway(
                `query deployment($id: String!) {
                  deployment(id: $id) {
                    id
                    status
                    createdAt
                    url
                    staticUrl
                  }
                }`,
                { id: deploymentId },
                tokenMode,
              );
              const deployment = deploymentData.deployment;
              const status = deployment?.status || "UNKNOWN";
              if (status !== lastStatus) {
                console.log(`[railway] deployment_status=${status}`);
                lastStatus = status;
              }
              if (status === "SUCCESS") {
                process.exit(0);
              }
              if (terminalStatuses.has(status)) {
                throw new Error(`Railway deployment ended with status ${status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error("Railway deployment did not finish within 20 minutes");
          }

          main().catch(error => {
            console.error(`[railway] ${error instanceof Error ? error.message : String(error)}`);
            process.exit(1);
          });
          NODE

      - name: Verify production version endpoint
        run: |
          set -euo pipefail
          base="${RAILWAY_PRODUCTION_URL%/}"
          expected="${GITHUB_SHA}"
          for attempt in $(seq 1 60); do
            body="$(curl --fail --show-error --silent --max-time 20 "$base/version.json" || true)"
            if BODY="$body" EXPECTED="$expected" node -e 'const payload = JSON.parse(process.env.BODY || "{}"); const commit = String(payload.commit || payload.version?.commit || ""); const expected = String(process.env.EXPECTED || ""); if (!commit || !expected) process.exit(1); if (commit === expected || commit.startsWith(expected.slice(0, 12))) { console.log(`[verify] production commit=${commit}`); process.exit(0); } process.exit(1);'
            then
              exit 0
            fi
            echo "[verify] waiting for production version endpoint attempt=$attempt"
            sleep 10
          done
          echo "::error title=Production version mismatch::version endpoint did not report ${GITHUB_SHA}"
          exit 1

      - name: Smoke production pages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_smoke != 'true' }}
        run: |
          set -euo pipefail
          base="${RAILWAY_PRODUCTION_URL%/}"
          html="$(curl --fail --show-error --silent --max-time 30 "$base/?cb=${GITHUB_SHA}")"
          if printf '%s' "$html" | grep -F "/assets/index-Cwp_1Y0L.js" >/dev/null; then
            echo "::error title=Old Manus bundle detected::Production HTML still references /assets/index-Cwp_1Y0L.js"
            exit 1
          fi
          printf '%s' "$html" | grep -E '/assets/index-[^"]+\.js' >/dev/null

          for path in \
            "/weekly?projectId=210001" \
            "/weekly?projectId=180001" \
            "/workspace?projectId=180001" \
            "/monthly-plan?projectId=180001" \
            "/questions?projectId=180001" \
            "/inclusion-monitoring?projectId=180001" \
            "/delivery-reports?projectId=180001"; do
            curl --fail --show-error --silent --max-time 30 -o /dev/null "$base$path"
          done
