name: Run 210001 Shadow Understand Baseline

on:
  workflow_dispatch:
    inputs:
      confirm_project_id:
        description: "Type 210001"
        required: true
        type: string

concurrency:
  group: understand-shadow-210001
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'ep-20251210143333-s6bb7' }}
      OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '60000' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      AI_OBSERVATION_LEDGER_V2: "false"
      CONFIRM_210001_SHADOW_BASELINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Enforce project scope
        run: test "${{ inputs.confirm_project_id }}" = "210001"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending schema migration
        run: pnpm db:migrate
      - name: Verify schema contract
        run: pnpm verify:shadow-understand-schema
      - name: Run real-model formal baseline
        run: pnpm understanding:shadow:210001 | tee shadow-baseline-report.jsonl
      - name: Upload redacted report
        uses: actions/upload-artifact@v4
        with:
          name: shadow-baseline-210001
          path: shadow-baseline-report.jsonl
          retention-days: 30
