name: Admin Password Access

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a read-only check or set the project owner email password"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - set-password
      project_id:
        description: "Project ID to verify"
        required: true
        default: "210001"
      admin_email:
        description: "Owner email to update in set-password mode; leave blank for check"
        required: false
        default: ""

concurrency:
  group: admin-password-access
  cancel-in-progress: false

jobs:
  admin-password-access:
    name: Admin Password Access
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_MODE: ${{ inputs.mode }}
      ADMIN_PROJECT_ID: ${{ inputs.project_id }}
      ADMIN_EMAIL: ${{ inputs.admin_email }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_RESET_VALUE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=Missing DATABASE_URL::DATABASE_URL repository secret is required"
            exit 1
          fi
          if [ "$ADMIN_MODE" = "set-password" ]; then
            if [ -z "${ADMIN_EMAIL:-}" ]; then
              echo "::error title=Missing admin email::admin_email workflow input is required in set-password mode"
              exit 1
            fi
            if [ -z "${ADMIN_PASSWORD:-}" ]; then
              echo "::error title=Missing password secret::ADMIN_PASSWORD_RESET_VALUE repository secret is required in set-password mode"
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run admin password access task
        run: node scripts/admin-set-password.mjs
