name: Run 210001 Understand Methodology V2
on:
  workflow_dispatch:
    inputs:
      confirm_project_id:
        description: "Type 210001"
        required: true
        type: string
concurrency:
  group: understand-methodology-v2-210001
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'ep-20251210143333-s6bb7' }}
      OPENAI_TIMEOUT_MS: ${{ vars.OPENAI_TIMEOUT_MS || '60000' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      AI_OBSERVATION_LEDGER_V2: "false"
      CONFIRM_210001_METHODOLOGY_V2: "true"
    steps:
      - uses: actions/checkout@v4
      - run: test "${{ inputs.confirm_project_id }}" = "210001"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run server/understandMethodologyV2.test.ts server/understandPrimaryReadiness.test.ts
      - run: pnpm verify:understand-methodology-v2-schema
      - name: TiDB migration
        run: pnpm db:migrate
      - name: Real-model v2 shadow baseline
        run: pnpm understanding:methodology-v2:210001 | tee methodology-v2-report.jsonl
      - uses: actions/upload-artifact@v4
        with: {name: methodology-v2-210001, path: methodology-v2-report.jsonl, retention-days: 30}
