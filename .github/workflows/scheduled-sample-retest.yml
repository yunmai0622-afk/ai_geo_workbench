name: Scheduled Sample Retest

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only scan due milestones; do not call AI or write results"
        required: false
        default: true
        type: boolean

concurrency:
  group: scheduled-sample-retest-210001
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'ep-20251210143333-s6bb7' }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Run due sample retests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            corepack pnpm tsx scripts/run_scheduled_sample_retest.ts --dry-run
          else
            corepack pnpm tsx scripts/run_scheduled_sample_retest.ts
          fi
