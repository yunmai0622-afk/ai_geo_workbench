<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 16px; font-family: sans-serif; background: #0a0a0f; color: #fff; }
    h2 { font-size: 16px; margin: 0 0 16px; color: #22d3ee; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; background: #1a1a2e; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 13px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #22d3ee; color: #000; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .platform-list { margin-top: 16px; }
    .platform-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; gap: 8px; }
    .platform-name { font-size: 13px; flex: 1; }
    .status { font-size: 11px; min-width: 48px; text-align: right; }
    .connected { color: #22c55e; }
    .disconnected { color: #888; }
    .connect-btn { padding: 4px 10px; font-size: 11px; background: transparent; border: 1px solid #444; border-radius: 4px; color: #ccc; cursor: pointer; white-space: nowrap; }
  </style>
</head>
<body>
  <h2>内容增长系统</h2>
  <div class="field">
    <label>服务器地址</label>
    <input id="serverUrl" placeholder="http://localhost:3000" />
  </div>
  <div class="field">
    <label>API 密钥</label>
    <input id="apiKey" placeholder="在系统设置里复制" />
  </div>
  <button id="saveBtn">保存设置</button>
  <div class="platform-list">
    <div class="platform-item">
      <span class="platform-name">知乎</span>
      <span class="status disconnected" id="zhihu-status">未连接</span>
      <button class="connect-btn" data-platform="zhihu" data-url="https://www.zhihu.com/signin">连接</button>
    </div>
    <div class="platform-item">
      <span class="platform-name">头条号</span>
      <span class="status disconnected" id="toutiao-status">未连接</span>
      <button class="connect-btn" data-platform="toutiao" data-url="https://mp.toutiao.com">连接</button>
    </div>
    <div class="platform-item">
      <span class="platform-name">搜狐号</span>
      <span class="status disconnected" id="sohu-status">未连接</span>
      <button class="connect-btn" data-platform="sohu" data-url="https://mp.sohu.com">连接</button>
    </div>
    <div class="platform-item">
      <span class="platform-name">百家号</span>
      <span class="status disconnected" id="baijiahao-status">未连接</span>
      <button class="connect-btn" data-platform="baijiahao" data-url="https://baijiahao.baidu.com">连接</button>
    </div>
    <div class="platform-item">
      <span class="platform-name">微信公众号</span>
      <span class="status disconnected" id="wechat-status">未连接</span>
      <button class="connect-btn" data-platform="wechat" data-url="https://mp.weixin.qq.com">连接</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
